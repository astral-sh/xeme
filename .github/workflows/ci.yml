name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --no-default-features
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  native:
    name: C ABI and callback safety
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libexpat1-dev pkg-config
      - run: cargo build --release --locked -p oriole_expat
      - name: Reference C consumer
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/c/integration.c $(pkg-config --cflags --libs expat) -o /tmp/reference-c
          /tmp/reference-c
      - name: Oriole C consumer and adversarial callbacks
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -I include tests/c/integration.c -L target/release -loriole_expat -o /tmp/oriole-c
          cc -std=c11 -O2 -Wall -Wextra -Werror -I include tests/c/adversarial.c -L target/release -loriole_expat -o /tmp/oriole-adversarial
          LD_LIBRARY_PATH=target/release /tmp/oriole-c
          LD_LIBRARY_PATH=target/release /tmp/oriole-adversarial
          cc -std=c11 -O2 -Wall -Wextra -Werror -I include tests/c/allocations.c -L target/release -loriole_expat -o /tmp/oriole-allocations
          LD_LIBRARY_PATH=target/release /tmp/oriole-allocations
  fuzz:
    name: Sanitized parser fuzz smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo fuzz run parse -- -max_total_time=30 -max_len=4096
      - run: cargo fuzz run streaming -- -max_total_time=30 -max_len=4096
