name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pgo:
        description: Run the optional profile-guided library validation
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ github.repository_owner == 'astral-sh' && (matrix.os == 'ubuntu-24.04' && 'github-ubuntu-24.04-x86_64-4' || matrix.os == 'ubuntu-24.04-arm' && 'github-ubuntu-24.04-aarch64-4') || matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-15]
        toolchain: [stable]
        include:
          - os: ubuntu-24.04
            toolchain: 1.96.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --no-default-features
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  lint:
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --manifest-path benchmarks/inprocess/Cargo.toml --check
      - run: cargo clippy --manifest-path benchmarks/inprocess/Cargo.toml --all-targets --locked -- -D warnings
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uvx --from ruff==0.16.6 ruff check tools benchmarks integration
      - run: uvx --from ty==0.0.80 ty check --extra-search-path tools tools benchmarks integration
      - run: python3 -m unittest discover -s benchmarks -p test_hillclimb.py
      - run: python3 -m unittest discover -s tools/cpython -p test_run.py
      - run: python3 -m unittest discover -s tools -p test_compatibility.py
      - run: python3 -m unittest discover -s tools -p test_differential.py
      - run: python3 -m unittest discover -s tools -p test_xml_abi.py
      - run: python3 benchmarks/hillclimb.py verify-holdout
      - run: python3 -m unittest discover -s tools/pgo -p test_build.py
      - run: python3 -m unittest discover -s integration/python-build-standalone -p test_pgo_bundle.py
  compatibility:
    name: Compatibility regression (${{ matrix.suite }})
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [api, w3c, differential]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: libexpat/libexpat
          ref: 12cf0b1f25f026a022fe728ad8f7e3d017285b80
          path: .cache/expat
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: matrix.suite == 'w3c'
        with:
          repository: lddubeau/xml-conformance-suite
          ref: 3fb4516daedd0ac736249a383733883b95fcdbb2
          path: .cache/w3c
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - name: Build the candidate and pinned reference
        run: |
          cargo rustc --release --locked -p xeme_expat --lib --crate-type cdylib,staticlib
          cmake -S .cache/expat/expat -B .cache/expat-build -DCMAKE_BUILD_TYPE=Release -DEXPAT_BUILD_TESTS=ON -DEXPAT_SHARED_LIBS=ON -DEXPAT_BUILD_TOOLS=OFF -DEXPAT_BUILD_EXAMPLES=OFF -DEXPAT_CONTEXT_BYTES=1024
          cmake --build .cache/expat-build --target expat --parallel 2
      - name: Run full Expat API matrix with reviewed failure boundaries
        if: matrix.suite == 'api'
        run: >-
          python3 -I -S tools/compatibility.py api
          --source .cache/expat --config .cache/expat-build/expat_config.h
          --library target/release/libxeme_expat.so --reference .cache/expat-build/libexpat.so
          --output "$RUNNER_TEMP/xeme-compat-api"
      - name: Run the complete pinned W3C catalog
        if: matrix.suite == 'w3c'
        run: >-
          python3 -I -S tools/compatibility.py w3c
          --source .cache/w3c/packages/test-data/xmlconf
          --library target/release/libxeme_expat.so --reference .cache/expat-build/libexpat.so
          --output "$RUNNER_TEMP/xeme-compat-w3c"
      - name: Compare generated XML semantics against Expat
        if: matrix.suite == 'differential'
        run: >-
          python3 -I -S tools/compatibility.py differential
          --library target/release/libxeme_expat.so --reference .cache/expat-build/libexpat.so
          --output "$RUNNER_TEMP/xeme-compat-differential"
      - name: Retain original failures and regression reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-${{ matrix.suite }}
          path: ${{ runner.temp }}/xeme-compat-*
          if-no-files-found: warn
          retention-days: 30
  allocator-miri:
    name: Allocator ownership (${{ matrix.model }})
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: stacked
            flags: ''
          - model: tree
            flags: -Zmiri-tree-borrows
    env:
      MIRIFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly-2026-09-10
          components: miri, rust-src
      - name: Record interpreter and prepare sysroot
        run: |
          rustc --version --verbose
          cargo miri --version
          cargo miri setup
      - name: Verify regression selection
        run: |
          cargo miri test --locked -p xeme_storage --lib -- --list > "$RUNNER_TEMP/allocator-miri-tests"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          names = {
              "tracked_box_raw_roundtrip_retains_header",
              "tracked_box_direct_drop_retains_header_and_tracker",
              "tracked_reborrowed_payload_resizes",
              "tracked_reborrowed_failed_resize_preserves_owner",
              "tracked_c_reborrowed_payload_retains_layout",
          }
          lines = (Path(os.environ["RUNNER_TEMP"]) / "allocator-miri-tests").read_text().splitlines()
          actual = {line.removesuffix(": test") for line in lines if line.endswith(": test")}
          assert {f"allocator::tests::{name}" for name in names} <= actual, actual
          PYTHON
      - name: Check allocation ownership and containers
        run: cargo miri test --locked -p xeme_storage --lib
  miri:
    name: C callback aliasing (${{ matrix.model }})
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: stacked
            flags: ''
          - model: tree
            flags: -Zmiri-tree-borrows
    env:
      MIRIFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly-2026-09-10
          components: miri, rust-src
      - name: Record interpreter and prepare sysroot
        run: |
          rustc --version --verbose
          cargo miri --version
          cargo miri setup
      - name: Verify focused test selection
        run: |
          cargo miri test --locked -p xeme --lib context_text_ -- --list > "$RUNNER_TEMP/miri-core-tests"
          cargo miri test --locked -p xeme_expat --lib context_text_ -- --list > "$RUNNER_TEMP/miri-c-tests"
          cargo miri test --locked -p xeme --lib native_raw_context_tests::matched_native_end_raw_keeps_owned_names_and_mode_boundaries -- --exact --list > "$RUNNER_TEMP/miri-end-core-tests"
          cargo miri test --locked -p xeme --test allocation native_raw_context_views_survive_every_feed_allocation_failure -- --exact --list > "$RUNNER_TEMP/miri-end-allocation-tests"
          cargo miri test --locked -p xeme_expat --lib tests::detached_end_owner_survives_default_current_children_stop_and_reset_rejection -- --exact --list > "$RUNNER_TEMP/miri-end-c-tests"
          python3 - <<'PY'
          import os
          from pathlib import Path

          expected = {
              "core": {
                  "context_text_native_prefix_precedes_late_accounting_error",
                  "context_text_bounds_and_ordinary_api_reuse",
                  "context_text_excluded_sources_keep_owned_text",
                  "context_text_foreign_generation_uses_owned_events",
              },
              "c": {
                  "context_input_allocation_failures_preserve_sticky_errors_and_owners",
                  "reference_raw_context_survives_default_reentry_suspend_and_abort",
                  "context_text_pointer_survives_reentry_suspend_and_abort",
                  "context_text_offsets_compaction_split_utf8_and_sizes",
                  "context_text_default_and_excluded_paths_keep_exact_bytes",
                  "context_text_frame_and_raw_oom_match_owned_mode",
                  "context_text_invalid_host_range_fails_closed",
                  "context_text_warmed_reservations_do_not_allocate",
                  "context_text_late_handler_after_suspension_uses_eager_raw",
              },
          }
          for target, names in expected.items():
              lines = (Path(os.environ["RUNNER_TEMP"]) / f"miri-{target}-tests").read_text().splitlines()
              actual = {line.removesuffix(": test") for line in lines if line.endswith(": test")}
              assert actual == {f"context_text_tests::{name}" for name in names}, (target, actual)

          expected_end = {
              "end-core": "native_raw_context_tests::matched_native_end_raw_keeps_owned_names_and_mode_boundaries",
              "end-allocation": "native_raw_context_views_survive_every_feed_allocation_failure",
              "end-c": "tests::detached_end_owner_survives_default_current_children_stop_and_reset_rejection",
          }
          for target, name in expected_end.items():
              lines = (Path(os.environ["RUNNER_TEMP"]) / f"miri-{target}-tests").read_text().splitlines()
              actual = {line.removesuffix(": test") for line in lines if line.endswith(": test")}
              assert actual == {name}, (target, actual)
          PY
      - name: Check core frame protocol
        run: cargo miri test --locked -p xeme --lib context_text_
      - name: Check callback pointers and re-entry
        run: cargo miri test --locked -p xeme_expat --lib context_text_
      - name: Check matched End raw ownership and mode boundaries
        run: cargo miri test --locked -p xeme --lib native_raw_context_tests::matched_native_end_raw_keeps_owned_names_and_mode_boundaries -- --exact
      - name: Check native raw feed allocation failures
        run: cargo miri test --locked -p xeme --test allocation native_raw_context_views_survive_every_feed_allocation_failure -- --exact
      - name: Check detached End callback lifetime
        run: cargo miri test --locked -p xeme_expat --lib tests::detached_end_owner_survives_default_current_children_stop_and_reset_rejection -- --exact
  native:
    name: C ABI and callback safety
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-aarch64-4' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libexpat1-dev pkg-config
      - run: cargo rustc --release --locked -p xeme_expat --lib --crate-type cdylib,staticlib
      - name: Reference C consumer
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/c/integration.c $(pkg-config --cflags --libs expat) -o /tmp/reference-c
          /tmp/reference-c
      - name: Xeme C consumer and adversarial callbacks
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -I include tests/c/integration.c -L target/release -lxeme_expat -o /tmp/xeme-c
          cc -std=c11 -O2 -Wall -Wextra -Werror -I include tests/c/adversarial.c -L target/release -lxeme_expat -o /tmp/xeme-adversarial
          LD_LIBRARY_PATH=target/release /tmp/xeme-c
          LD_LIBRARY_PATH=target/release /tmp/xeme-adversarial
          cc -std=c11 -O2 -Wall -Wextra -Werror -I include tests/c/allocations.c -L target/release -lxeme_expat -o /tmp/xeme-allocations
          LD_LIBRARY_PATH=target/release /tmp/xeme-allocations
  fuzz:
    name: Sanitized parser fuzz smoke
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-aarch64-4' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: libexpat/libexpat
          ref: 12cf0b1f25f026a022fe728ad8f7e3d017285b80
          path: .cache/expat
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo test --manifest-path fuzz/Cargo.toml --lib --locked
      - run: cargo fuzz run parse -- -max_total_time=30 -max_len=4096
      - run: cargo fuzz run streaming -- -max_total_time=30 -max_len=4096
      - run: cargo fuzz run ffi fuzz/seeds/ffi -- -max_total_time=30 -max_len=65536
      - run: cargo fuzz run ffi_family fuzz/seeds/ffi_family -- -max_total_time=30 -max_len=65536
      - run: cargo fuzz run multibyte fuzz/seeds/multibyte -- -max_total_time=30 -max_len=65536
      - run: cargo fuzz run value_family fuzz/seeds/value_family -- -max_total_time=30 -max_len=65536
      - name: Build the isolated Expat oracle
        run: |
          cmake -S .cache/expat/expat -B .cache/expat-build -DCMAKE_BUILD_TYPE=Release -DEXPAT_SHARED_LIBS=ON -DEXPAT_BUILD_TESTS=OFF -DEXPAT_BUILD_TOOLS=OFF -DEXPAT_BUILD_EXAMPLES=OFF
          cmake --build .cache/expat-build --target expat --parallel 2
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iinclude fuzz/expat_oracle.c "$GITHUB_WORKSPACE/.cache/expat-build/libexpat.so" -Wl,-rpath,"$GITHUB_WORKSPACE/.cache/expat-build" -o "$RUNNER_TEMP/expat-oracle"
      - name: Fuzz semantic compatibility against Expat
        run: >-
          XEME_EXPAT_ORACLE="$RUNNER_TEMP/expat-oracle"
          cargo fuzz run expat_differential fuzz/seeds/expat_differential --
          -max_len=8193 -timeout=10 -rss_limit_mb=1536 -max_total_time=300
      - name: Retain differential fuzz failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: differential-fuzz-failures
          path: fuzz/artifacts/expat_differential/
          if-no-files-found: ignore

  cpython:
    name: CPython XML consumers (${{ matrix.linkage }})
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 3bb231a6a5dc02b95658877318bf61501a7209e9
          path: .cache/cpython
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv python install 3.12.13
      - run: cargo rustc --release --locked -p xeme_expat --lib --crate-type cdylib,staticlib
      - name: Run actual shared-library consumers
        if: matrix.linkage == 'shared'
        run: >-
          uv run --no-project --python 3.12.13 python tools/cpython/run.py
          --source .cache/cpython --library target/release/libxeme_expat.so
          --output /tmp/xeme-cpython-shared --allow-text-fragmentation
      - name: Run actual static-library consumers
        if: matrix.linkage == 'static'
        run: >-
          uv run --no-project --python 3.12.13 python tools/cpython/run.py
          --source .cache/cpython --library target/release/libxeme_expat.a
          --native-library gcc_s --native-library util --native-library rt
          --native-library pthread --native-library m --native-library dl
          --native-library c --output /tmp/xeme-cpython-static --allow-text-fragmentation
      - name: Show consumer test results
        if: always()
        run: cat /tmp/xeme-cpython-*/probe.log /tmp/xeme-cpython-*/tests.log
      - name: Run consumers with upstream cleanup backport
        run: |
          if [ '${{ matrix.linkage }}' = shared ]; then
            uv run --no-project --python 3.12.13 python tools/cpython/run.py \
              --source .cache/cpython --library target/release/libxeme_expat.so \
              --output /tmp/xeme-cpython-fixed --consumer-fix --allow-text-fragmentation
          else
            uv run --no-project --python 3.12.13 python tools/cpython/run.py \
              --source .cache/cpython --library target/release/libxeme_expat.a \
              --native-library gcc_s --native-library util --native-library rt \
              --native-library pthread --native-library m --native-library dl \
              --native-library c --output /tmp/xeme-cpython-fixed --consumer-fix --allow-text-fragmentation
          fi
      - name: Check CPython cleanup under child allocation failure
        run: |
          uv run --no-project --python 3.12.13 python integration/python-build-standalone/consumer-fix/run.py \
            --original-extension /tmp/xeme-cpython-${{ matrix.linkage }}/pyexpat*.so \
            --fixed-extension /tmp/xeme-cpython-fixed/pyexpat*.so \
            --output /tmp/xeme-cpython-fault
      - name: Show patched consumer results
        if: always()
        run: cat /tmp/xeme-cpython-*/probe.log /tmp/xeme-cpython-*/tests.log

  pbs-recipe:
    name: PBS integration recipe
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: astral-sh/python-build-standalone
          ref: a4553880293fe9d1bb62747d34ab0e5121d3554f
          path: .cache/pbs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: python/cpython
          ref: 3bb231a6a5dc02b95658877318bf61501a7209e9
          path: .cache/cpython
      - run: python3 integration/python-build-standalone/validate.py --pbs .cache/pbs --cpython .cache/cpython
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rust-docs
      - name: Build the PBS static library bundle
        run: python3 integration/python-build-standalone/prepare.py --output "$RUNNER_TEMP/xeme-pbs-bundle"

  pgo:
    name: Profile-guided library
    if: github.event_name == 'workflow_dispatch' && inputs.pgo
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Build the normal and profile-guided libraries
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          sysroot=$(rustc --print sysroot)
          cargo rustc --release --locked --target "$host" -p xeme_expat --lib --crate-type cdylib,staticlib
          uv run --offline tools/pgo/build.py \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/xeme-pgo" \
            --llvm-profdata "$sysroot/lib/rustlib/$host/bin/llvm-profdata"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xeme-pgo'
          latest = json.loads((root / 'latest.json').read_text())
          manifest = pathlib.Path(latest['manifest'])
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == latest['sha256']
          data = json.loads(manifest.read_text())
          assert data['status'] == 'passed'
          library = manifest.parent / 'use/libxeme_expat.so'
          assert hashlib.sha256(library.read_bytes()).hexdigest() == data['libraries_sha256']['use/libxeme_expat.so']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'XEME_PGO_LIBRARY={library}\n')
              stream.write(f'XEME_NORMAL_LIBRARY={os.environ["GITHUB_WORKSPACE"]}/target/{data["host"]}/release/libxeme_expat.so\n')
          PY
      - name: Compare optimized callbacks with the normal build
        run: >-
          python3 tools/differential.py --library "$XEME_PGO_LIBRARY"
          --reference "$XEME_NORMAL_LIBRARY" --strict
          --output "$RUNNER_TEMP/xeme-pgo-differential" --generated 100
      - name: Exercise optimized C callbacks and allocation failures
        run: |
          for source in integration adversarial allocations; do
            cc -std=c11 -O2 -Wall -Wextra -Werror -I include \
              "tests/c/$source.c" "$XEME_PGO_LIBRARY" \
              -Wl,-rpath,"$(dirname "$XEME_PGO_LIBRARY")" -o "$RUNNER_TEMP/xeme-pgo-$source"
            "$RUNNER_TEMP/xeme-pgo-$source"
          done
      - name: Retain profile build and comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
