name: PBS distribution

on:
  pull_request:
    paths:
      - '.github/workflows/pbs.yml'
      - 'integration/python-build-standalone/**'
  workflow_dispatch:
    inputs:
      pbs_target:
        description: Explicit CPU requirement for the experimental distribution
        type: choice
        required: true
        default: x86_64-unknown-linux-gnu
        options:
          - x86_64-unknown-linux-gnu
          - x86_64_v3-unknown-linux-gnu
      pgo:
        description: Train and bundle a fresh Xeme PGO library
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pbs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    # This expensive integration gate has a dedicated review layer.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'charlie/codex-xeme-pbs-')
    runs-on: ${{ github.repository_owner == 'astral-sh' && 'github-ubuntu-24.04-x86_64-4' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      XEME_PBS_TARGET: ${{ inputs.pbs_target || 'x86_64-unknown-linux-gnu' }}
      XEME_PGO: ${{ github.event_name == 'workflow_dispatch' && inputs.pgo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: astral-sh/python-build-standalone
          ref: a4553880293fe9d1bb62747d34ab0e5121d3554f
          path: .cache/pbs
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Verify the explicit CPU requirement
        run: |
          python3 integration/python-build-standalone/pbs_target.py \
            --pbs-target "$XEME_PBS_TARGET" --check-host > "$RUNNER_TEMP/pbs-host-cpu.json"
      - name: Build the distribution validator
        working-directory: .cache/pbs
        run: |
          set -o pipefail
          cargo build --release --locked 2>&1 | tee "$RUNNER_TEMP/pbs-validator-build.log"
      - name: Prepare optional PGO tools
        if: ${{ env.XEME_PGO == 'true' }}
        run: |
          rustup component add llvm-tools-preview
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          xeme_profdata="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-profdata"
          test -x "$xeme_profdata"
          printf 'XEME_PGO_PROFDATA=%s\n' "$xeme_profdata" >> "$GITHUB_ENV"
      - name: Build the frozen Xeme bundle
        run: |
          rustup component add rust-docs
          python3 integration/python-build-standalone/validate-tls.py --output "$RUNNER_TEMP/pbs-tls-probe"
          if [[ "$XEME_PGO" == 'true' ]]; then
            python3 integration/python-build-standalone/prepare.py --output "$RUNNER_TEMP/xeme-bundle" \
              --pbs-target "$XEME_PBS_TARGET" \
              --pgo --llvm-profdata "$XEME_PGO_PROFDATA"
          else
            python3 integration/python-build-standalone/prepare.py --output "$RUNNER_TEMP/xeme-bundle" \
              --pbs-target "$XEME_PBS_TARGET"
          fi
          git -C .cache/pbs apply --check "$GITHUB_WORKSPACE/integration/python-build-standalone/pbs-a455388.patch"
          git -C .cache/pbs apply "$GITHUB_WORKSPACE/integration/python-build-standalone/pbs-a455388.patch"
      - name: Build CPython 3.12.13 with Xeme
        id: build_distribution
        run: |
          set -o pipefail
          bash integration/python-build-standalone/run.sh "$GITHUB_WORKSPACE/.cache/pbs" "$RUNNER_TEMP/xeme-bundle" "$XEME_PBS_TARGET" 2>&1 | tee "$RUNNER_TEMP/pbs-build.log"
      - name: Preserve the experimental distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xeme-pbs-experimental-${{ env.XEME_PBS_TARGET }}-${{ env.XEME_PGO == 'true' && 'pgo' || 'normal' }}
          path: .cache/pbs/dist/*.tar.zst
          if-no-files-found: error
          retention-days: 7
      - name: Verify the installed parser identity
        id: installed_identity
        if: ${{ !cancelled() && steps.build_distribution.outcome == 'success' }}
        working-directory: .cache/pbs
        run: |
          uv run --no-dev python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          from pythonbuild.utils import extract_python_archive
          sys.path.insert(0, str(pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'integration/python-build-standalone'))
          import pbs_target
          archive, = pathlib.Path('dist').glob('*.tar.zst')
          target = os.environ['XEME_PBS_TARGET']
          assert archive.name.startswith(f'cpython-3.12.13-{target}-noopt-') and archive.name.endswith('.tar.zst'), archive
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pbs-extracted'
          destination.mkdir()
          root = extract_python_archive(archive, destination)
          metadata = json.loads((root / 'PYTHON.json').read_text())
          assert metadata['target_triple'] == target, metadata['target_triple']
          installed = root / 'licenses/LICENSE.xeme-build.txt'
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xeme-bundle'
          assert installed.read_bytes() == (bundle / 'manifest.json').read_bytes()
          manifest = json.loads(installed.read_text())
          pbs_target.validate(manifest, target)
          archive_hash = hashlib.sha256((root / 'build/lib/libexpat.a').read_bytes()).hexdigest()
          assert archive_hash == manifest['files']['libexpat.a']
          assert archive_hash == hashlib.sha256((bundle / 'libexpat.a').read_bytes()).hexdigest()
          if os.environ['XEME_PGO'] == 'true':
              assert archive_hash == manifest['pgo']['manifest']['libraries_sha256']['use/libxeme_expat.a']
          else:
              assert 'pgo' not in manifest
          provenance = {'archive': archive.name, 'pbs_target': target, 'rust_target': manifest['rust_target'],
                        'target_cpu': manifest['target_cpu'], 'pgo': os.environ['XEME_PGO'] == 'true',
                        'static_archive_sha256': archive_hash, 'installed_manifest_sha256': hashlib.sha256(installed.read_bytes()).hexdigest(),
                        'python_metadata_sha256': hashlib.sha256((root / 'PYTHON.json').read_bytes()).hexdigest()}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'pbs-installed-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          executable = root / metadata['python_exe']
          subprocess.run([str(executable), '-I', '-c', "import pyexpat; print(pyexpat.EXPAT_VERSION); assert pyexpat.EXPAT_VERSION.startswith('xeme_')"], check=True)
          PY
          sha256sum dist/*.tar.zst > "$RUNNER_TEMP/pbs-archive-sha256.txt"
      - name: Validate the complete distribution
        working-directory: .cache/pbs
        run: |
          set -o pipefail
          target/release/pythonbuild validate-distribution dist/*.tar.zst 2>&1 | tee "$RUNNER_TEMP/pbs-validate.log"
          uv run --no-dev test-distribution.py dist/*.tar.zst 2>&1 | tee "$RUNNER_TEMP/pbs-custom-tests.log"
          uv run --no-dev test-distribution.py --stdlib dist/*.tar.zst \
            test_pyexpat test_xml_etree test_xml_etree_c test_minidom test_sax test_pulldom \
            2>&1 | tee "$RUNNER_TEMP/pbs-xml-tests.log"
      - name: Run the installed interpreter on glibc 2.17
        if: ${{ !cancelled() && steps.installed_identity.outcome == 'success' }}
        run: |
          set -o pipefail
          docker run --rm --network=none \
            -v "$RUNNER_TEMP/pbs-extracted/python:/python:ro" \
            -v "$GITHUB_WORKSPACE/integration/python-build-standalone:/checks:ro" \
            docker.io/library/centos@sha256:dead07b4d8ed7e29e98de0f4504d87e8880d4347859d839686a31da35a3b532f \
            /python/install/bin/python3.12 -I /checks/test-old-glibc.py \
            2>&1 | tee "$RUNNER_TEMP/pbs-glibc217-tests.log"
      - name: Retain build and validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xeme-pbs-validation-${{ env.XEME_PBS_TARGET }}-${{ env.XEME_PGO == 'true' && 'pgo' || 'normal' }}
          path: |
            ${{ runner.temp }}/pbs-*.log
            ${{ runner.temp }}/pbs-archive-sha256.txt
            ${{ runner.temp }}/pbs-host-cpu.json
            ${{ runner.temp }}/pbs-installed-provenance.json
            ${{ runner.temp }}/xeme-bundle/manifest.json
            ${{ runner.temp }}/xeme-bundle/build.log
            ${{ runner.temp }}/xeme-bundle/pgo/latest.json
            ${{ runner.temp }}/xeme-bundle/pgo/runs/
            !${{ runner.temp }}/xeme-bundle/pgo/runs/**/*.a
            !${{ runner.temp }}/xeme-bundle/pgo/runs/**/*.so
            !${{ runner.temp }}/xeme-bundle/pgo/runs/**/*.dylib
            ${{ runner.temp }}/pbs-tls-probe/manifest.json
            ${{ runner.temp }}/pbs-tls-probe/*-symbols.txt
          retention-days: 14
