[package]
name = "oriole-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
oriole = { path = "../crates/oriole" }
oriole_expat = { path = "../crates/oriole_expat" }

[[bin]]
name = "streaming"
path = "fuzz_targets/streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi"
path = "fuzz_targets/ffi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ffi_family"
path = "fuzz_targets/ffi_family.rs"
test = false
doc = false
bench = false
